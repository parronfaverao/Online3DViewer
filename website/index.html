<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="content-type" content="text/html;charset=utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no">
    <link rel="icon" type="image/png" href="assets/images/3dviewer_net_favicon.ico">
    <link rel="canonical" href="https://3dviewer.net">

    <title>Online 3D Viewer</title>

    <!-- meta start -->
    <!-- meta end -->

    <!-- website start -->
    <link rel="stylesheet" type="text/css" href="../build/website_dev/o3dv.website.min.css">
    <script type="text/javascript" src="../build/website_dev/o3dv.website.min.js"></script>
    <!-- website end -->
    <!-- plugins start -->
    <!-- plugins end -->

    <!-- website analytics start -->
    <script type="text/javascript">
        OV.SetWebsiteEventHandler ((eventName, eventLabel, eventParams) => {
            console.log ({
                eventName : eventName,
                eventLabel : eventLabel,
                eventParams : eventParams
            });
        });
    </script>
    <!-- website analytics end -->

    <script type="text/javascript">
        OV.StartWebsite ();
    </script>

</head>

<body>
    <input type="file" id="open_file" style="display:none;" multiple></input>
    <div class="header" id="header">
        <div class="title">
            <div class="title_left">
                <!-- Logo commented out for future reference -->
                <!-- <a href="index.html">
                    <img src="assets/images/3dviewer_net_logo.jpg" alt="Online 3D Viewer" class="logo_image" />
                </a> -->
            </div>
            <div class="title_right" id="header_buttons"></div>
            <div class="main_file_name only_full_width" id="main_file_name"></div>
        </div>
        <div class="toolbar" id="toolbar"></div>
    </div>
    <div class="main" id="main">
        <div class="main_left_container only_full_width" id="main_left_container">
            <div class="main_navigator ov_panel_set_container" id="main_navigator"></div>
            <div class="main_splitter" id="main_navigator_splitter"></div>
        </div>
        <div class="main_viewer" id="main_viewer"></div>
        <div class="main_right_container only_full_width" id="main_right_container">
            <div class="main_splitter" id="main_sidebar_splitter"></div>
            <div class="main_sidebar ov_panel_set_right_container" id="main_sidebar"></div>
        </div>
    </div>
    <div class="intro ov_thin_scrollbar" id="intro">
        <div class="intro_content" id="intro_content">
            <div class="intro_logo">
                <img src="assets/images/3dviewer_net_logo.png" alt="Online 3D Viewer" class="intro_logo" />
                <div class="intro_dragdrop_text" id="intro_dragdrop_text"></div>
                <div class="intro_buttons">
                    <button class="intro_button" id="intro_jobs_folder_button" title="Open JOBS folder">
                        <div class="ov_svg_icon intro_button_icon">
                            <i class="icon icon-files"></i>
                        </div>
                        <span class="intro_button_text">Open JOBS Folder</span>
                    </button>
                    <button class="intro_button" id="intro_open_file_button" title="Open file from device">
                        <div class="ov_svg_icon intro_button_icon">
                            <i class="icon icon-open"></i>
                        </div>
                        <span class="intro_button_text">Open File</span>
                    </button>
                </div>
            </div>
            <div class="intro_formats">
                <div class="intro_formats_title" id="intro_formats_title"></div>
                <div class="intro_file_formats">
                    <a href="#model=/website/assets/models/RhinoLogo.3dm">3dm</a>
                    <a href="#model=/website/assets/models/cubes.3ds,/website/assets/models/texture.png">3ds</a>
                    <a href="#model=/website/assets/models/rhombicuboctahedron.3mf">3mf</a>
                    <a href="#model=/website/assets/models/rook.amf">amf</a>
                    <a href="#model=/website/assets/models/MultipleMeshes.bim">bim</a>
                    <a href="#model=/website/assets/models/as1_pe_203.brep">brep</a>
                    <a href="#model=/website/assets/models/X_Bot.dae">dae</a>
                    <a href="#model=/website/assets/models/Y_Bot.fbx">fbx</a>
                    <a href="#model=/website/assets/models/ArchDetail.FCStd">fcstd</a>
                    <a href="#model=/website/assets/models/DamagedHelmet.glb">gltf</a>
                    <a href="#model=/website/assets/models/haus.ifc">ifc</a>
                    <a href="#model=/website/assets/models/as1_pe_203.igs">iges</a>
                    <a href="#model=/website/assets/models/as1_pe_203.stp">step</a>
                    <a href="#model=/website/assets/models/utah_teapot.stl">stl</a>
                    <a href="#model=/website/assets/models/solids.obj,/website/assets/models/solids.mtl">obj</a>
                    <a href="#model=/website/assets/models/cube.off">off</a>
                    <a href="#model=/website/assets/models/cow.ply">ply</a>
                    <a href="#model=/website/assets/models/extrusion3.wrl">wrl</a>
                </div>
            </div>
            <!-- intro footer start -->
            <!-- intro footer end -->
        </div>
    </div>
</body>

</html>
